name: Build macOS

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build macOS
        run: flutter build macos --release
      
      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          mkdir -p dmg_contents
          cp -R "Koleo Browser.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "Koleo Browser" -srcfolder dmg_contents -ov -format UDZO KoleoBrowser.dmg
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoleoBrowser-macOS
          path: build/macos/Build/Products/Release/KoleoBrowser.dmg
