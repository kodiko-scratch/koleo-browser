name: Build macOS

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13  # Intel Mac runner
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build macOS (Intel)
        run: flutter build macos --release
      
      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          mkdir -p dmg_contents
          cp -R "Koleo Browser.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "Koleo Browser" -srcfolder dmg_contents -ov -format UDZO KoleoBrowser-Intel.dmg
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoleoBrowser-macOS-Intel
          path: build/macos/Build/Products/Release/KoleoBrowser-Intel.dmg
          
  build-macos-arm:
    runs-on: macos-14  # Apple Silicon runner
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build macOS (Apple Silicon)
        run: flutter build macos --release
      
      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          mkdir -p dmg_contents
          cp -R "Koleo Browser.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "Koleo Browser" -srcfolder dmg_contents -ov -format UDZO KoleoBrowser-AppleSilicon.dmg
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoleoBrowser-macOS-AppleSilicon
          path: build/macos/Build/Products/Release/KoleoBrowser-AppleSilicon.dmg
